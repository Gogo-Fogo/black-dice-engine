id: "sample-campaign"
title: "The Debt of Glassfen"
subtitle: "Three mercenaries, one impossible contract, and a coastline that swallows secrets."
visibility: "public_demo"
tone:
  - "dark frontier mystery"
  - "mercenary survival"
  - "body horror beneath the waves"
  - "gallows humor"
safety:
  rating: "teen"
  lines:
    - "No graphic torture."
    - "No harm to children."
  veils:
    - "Romance fades to black."
    - "Severe injury described briefly, not graphically."
facts:
  - id: "fact-contract"
    text: "The party accepted a job from the Lantern Gate watch-captain: investigate a missing salvage crew last seen near the Tide-Road Arch."
    source: "sample-campaign"
  - id: "fact-water"
    text: "The Glassfen Coast is known for fog banks that carry sound farther than sight. Something in the deep has started answering back."
    source: "sample-campaign"
  - id: "fact-payment"
    text: "The contract pays 200 gold per head, plus salvage rights. Shlomo negotiated a 15% interest clause on late payment, which the captain did not read carefully."
    source: "sample-campaign"
  - id: "fact-missing-crew"
    text: "The salvage crew 'The Silt Divers' went missing 4 days ago. Their last message was a signal lantern blinking the pattern for 'found it — coming back slow.' They never arrived."
    source: "sample-campaign"
